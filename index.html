<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Hub</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #1a1d2d;
      --accent: #6c5ce7;
      --accent-hover: #8174f0;
      --text: #f5f6fa;
      --muted: #8c92ac;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #a29bfe, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav {
      display: flex;
      gap: 10px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .nav button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav button.active {
      background: var(--accent);
      color: #fff;
    }
    .game-container {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 12px;
      font-weight: 600;
      color: #dfe6e9;
    }
    canvas {
      background: #131520;
      border-radius: 8px;
      border: 2px solid #2d324d;
    }
    .grid-2048 {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-template-rows: repeat(4, 80px);
      gap: 10px;
      background: #2d324d;
      padding: 10px;
      border-radius: 10px;
    }
    .tile {
      background: #1a1d2d;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .controls {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    .restart-btn {
      margin-top: 10px;
      background: #2d324d;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .restart-btn:hover { background: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>ARCADE HUB</h1>
    <div class="nav">
      <button id="btn-snake" class="active" onclick="switchGame('snake')">Snake</button>
      <button id="btn-pong" onclick="switchGame('pong')">Pong</button>
      <button id="btn-2048" onclick="switchGame('2048')">2048</button>
    </div>
  </header>

  <!-- SNAKE -->
  <div id="view-snake" class="game-container">
    <div class="hud"><span>Snake</span><span>Score: <span id="snake-score">0</span></span></div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div class="controls">WASD or Arrow Keys to move</div>
    <button class="restart-btn" onclick="resetSnake()">Restart</button>
  </div>

  <!-- PONG -->
  <div id="view-pong" class="game-container hidden">
    <div class="hud"><span>You: <span id="pong-p1">0</span></span><span>CPU: <span id="pong-p2">0</span></span></div>
    <canvas id="pongCanvas" width="400" height="400"></canvas>
    <div class="controls">W / S or Up / Down Arrows</div>
    <button class="restart-btn" onclick="resetPong()">Reset Score</button>
  </div>

  <!-- 2048 -->
  <div id="view-2048" class="game-container hidden">
    <div class="hud"><span>2048</span><span>Score: <span id="score-2048">0</span></span></div>
    <div id="board-2048" class="grid-2048"></div>
    <div class="controls">WASD or Arrow Keys to slide tiles</div>
    <button class="restart-btn" onclick="init2048()">New Game</button>
  </div>

  <script>
    let currentGame = 'snake';

    // Lock Chromebook scrolling on arrow/space keys
    window.addEventListener("keydown", function(e) {
      if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
      }
    }, false);

    function switchGame(game) {
      currentGame = game;
      ['snake', 'pong', '2048'].forEach(g => {
        document.getElementById('view-' + g).classList.toggle('hidden', g !== game);
        document.getElementById('btn-' + g).classList.toggle('active', g === game);
      });
    }

    // --- SNAKE LOGIC ---
    const sCanvas = document.getElementById("snakeCanvas");
    const sCtx = sCanvas.getContext("2d");
    const grid = 20;
    let sCount = 0, sScore = 0;
    let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
    let apple = { x: 320, y: 320 };

    function resetSnake() {
      snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
      sScore = 0;
      document.getElementById("snake-score").textContent = 0;
    }

    function loopSnake() {
      requestAnimationFrame(loopSnake);
      if (currentGame !== 'snake' || ++sCount < 6) return;
      sCount = 0;
      sCtx.clearRect(0, 0, 400, 400);
      snake.x += snake.dx; snake.y += snake.dy;
      if (snake.x < 0) snake.x = 380; else if (snake.x >= 400) snake.x = 0;
      if (snake.y < 0) snake.y = 380; else if (snake.y >= 400) snake.y = 0;
      snake.cells.unshift({ x: snake.x, y: snake.y });
      if (snake.cells.length > snake.maxCells) snake.cells.pop();

      sCtx.fillStyle = "#ff7675";
      sCtx.fillRect(apple.x, apple.y, grid - 2, grid - 2);

      sCtx.fillStyle = "#55efc4";
      snake.cells.forEach((cell, idx) => {
        sCtx.fillRect(cell.x, cell.y, grid - 2, grid - 2);
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          sScore += 10;
          document.getElementById("snake-score").textContent = sScore;
          apple.x = Math.floor(Math.random() * 20) * grid;
          apple.y = Math.floor(Math.random() * 20) * grid;
        }
        for (let i = idx + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) resetSnake();
        }
      });
    }

    // --- PONG LOGIC ---
    const pCanvas = document.getElementById("pongCanvas");
    const pCtx = pCanvas.getContext("2d");
    let p1Y = 160, p2Y = 160, p1Score = 0, p2Score = 0;
    let ball = { x: 200, y: 200, dx: 4, dy: 3 };
    let keys = {};

    function resetPong() {
      p1Score = 0; p2Score = 0;
      document.getElementById("pong-p1").textContent = 0;
      document.getElementById("pong-p2").textContent = 0;
      ball = { x: 200, y: 200, dx: 4, dy: 3 };
    }

    function loopPong() {
      requestAnimationFrame(loopPong);
      if (currentGame !== 'pong') return;
      pCtx.clearRect(0, 0, 400, 400);

      if ((keys['w'] || keys['arrowup']) && p1Y > 0) p1Y -= 5;
      if ((keys['s'] || keys['arrowdown']) && p1Y < 320) p1Y += 5;

      // Simple CPU AI
      if (p2Y + 40 < ball.y && p2Y < 320) p2Y += 3.5;
      else if (p2Y + 40 > ball.y && p2Y > 0) p2Y -= 3.5;

      ball.x += ball.dx; ball.y += ball.dy;
      if (ball.y <= 0 || ball.y >= 390) ball.dy *= -1;

      // Paddle collisions
      if (ball.x <= 20 && ball.y >= p1Y && ball.y <= p1Y + 80) ball.dx = Math.abs(ball.dx);
      if (ball.x >= 370 && ball.y >= p2Y && ball.y <= p2Y + 80) ball.dx = -Math.abs(ball.dx);

      if (ball.x < 0) { p2Score++; document.getElementById("pong-p2").textContent = p2Score; ball = { x: 200, y: 200, dx: 4, dy: 3 }; }
      if (ball.x > 400) { p1Score++; document.getElementById("pong-p1").textContent = p1Score; ball = { x: 200, y: 200, dx: -4, dy: 3 }; }

      pCtx.fillStyle = "#74b9ff";
      pCtx.fillRect(10, p1Y, 10, 80);
      pCtx.fillStyle = "#ff7675";
      pCtx.fillRect(380, p2Y, 10, 80);
      pCtx.fillStyle = "#fff";
      pCtx.fillRect(ball.x, ball.y, 10, 10);
    }

    // --- 2048 LOGIC ---
    let board = [], score2048 = 0;
    const colors2048 = { 0:'#1a1d2d', 2:'#2d3436', 4:'#3d3d3d', 8:'#e17055', 16:'#d63031', 32:'#e84393', 64:'#6c5ce7', 128:'#0984e3', 256:'#00b894', 512:'#fdcb6e', 1024:'#e17055', 2048:'#ffeaa7' };

    function init2048() {
      board = Array(4).fill().map(() => Array(4).fill(0));
      score2048 = 0;
      addTile(); addTile(); render2048();
    }

    function addTile() {
      let empty = [];
      for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(board[r][c] === 0) empty.push({r,c});
      if(empty.length) {
        let {r, c} = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render2048() {
      const container = document.getElementById("board-2048");
      container.innerHTML = '';
      document.getElementById("score-2048").textContent = score2048;
      for(let r=0; r<4; r++) {
        for(let c=0; c<4; c++) {
          let val = board[r][c];
          let div = document.createElement("div");
          div.className = "tile";
          div.style.background = colors2048[val] || '#6c5ce7';
          div.style.color = val > 4 ? '#fff' : '#dfe6e9';
          div.textContent = val || '';
          container.appendChild(div);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(v => v);
      for(let i=0; i<arr.length-1; i++) {
        if(arr[i] === arr[i+1]) { arr[i] *= 2; score2048 += arr[i]; arr[i+1] = 0; }
      }
      arr = arr.filter(v => v);
      while(arr.length < 4) arr.push(0);
      return arr;
    }

    function move2048(dir) {
      let old = JSON.stringify(board);
      if(dir === 'left') board = board.map(r => slide(r));
      if(dir === 'right') board = board.map(r => slide(r.reverse()).reverse());
      if(dir === 'up' || dir === 'down') {
        for(let c=0; c<4; c++) {
          let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
          if(dir === 'down') col.reverse();
          col = slide(col);
          if(dir === 'down') col.reverse();
          for(let r=0; r<4; r++) board[r][c] = col[r];
        }
      }
      if(old !== JSON.stringify(board)) { addTile(); render2048(); }
    }

    // --- GLOBAL CONTROLS ---
    window.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if(currentGame === 'snake') {
        if((k==='arrowleft'||k==='a') && snake.dx===0) { snake.dx=-grid; snake.dy=0; }
        if((k==='arrowup'||k==='w') && snake.dy===0) { snake.dy=-grid; snake.dx=0; }
        if((k==='arrowright'||k==='d') && snake.dx===0) { snake.dx=grid; snake.dy=0; }
        if((k==='arrowdown'||k==='s') && snake.dy===0) { snake.dy=grid; snake.dx=0; }
      } else if(currentGame === '2048') {
        if(k==='arrowleft'||k==='a') move2048('left');
        if(k==='arrowup'||k==='w') move2048('up');
        if(k==='arrowright'||k==='d') move2048('right');
        if(k==='arrowdown'||k==='s') move2048('down');
      }
    });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    init2048();
    requestAnimationFrame(loopSnake);
    requestAnimationFrame(loopPong);
  </script>
</body>
</html>
